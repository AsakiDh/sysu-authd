name: Build SYSU Authd for GL-MT1300

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout fork source
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget xz-utils tar file gzip coreutils ca-certificates

      - name: Download matching OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://downloads.openwrt.org/releases/22.03.4/targets/ramips/mt7621'
          curl -fsSL "$BASE/" -o sdk-index.html
          SDK_FILE=$(grep -oE 'openwrt-sdk-22\.03\.4-ramips-mt7621_[^"<> ]+\.tar\.xz' sdk-index.html | head -n 1 || true)
          if [ -z "$SDK_FILE" ]; then
            echo 'Cannot locate OpenWrt 22.03.4 ramips/mt7621 SDK in official index.' >&2
            exit 1
          fi
          echo "Downloading $SDK_FILE"
          curl -fL --retry 3 "$BASE/$SDK_FILE" -o openwrt-sdk.tar.xz
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar -xJf openwrt-sdk.tar.xz -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "SDK=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Build SYSU Authd and LuCI IPKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          SDK="$SDK" PKG_ARCH=mipsel_24kc BUILD_LUCI=1 ./scripts/build-openwrt.sh
          test -f dist/openwrt/sysu-authd_0.1.2-1_mipsel_24kc.ipk
          test -f dist/openwrt/luci-app-sysu-authd_0.1.2-1_all.ipk
          sha256sum dist/openwrt/*.ipk

      - name: Upload installation packages
        uses: actions/upload-artifact@v4
        with:
          name: sysu-authd-GL-MT1300-OpenWrt-22.03.4
          path: dist/openwrt/*.ipk
          if-no-files-found: error
          retention-days: 14
